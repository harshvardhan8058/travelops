# ---------------------------------------------------------------------------
# WHY THE PRIMARY HASH IS PENDING.
#
# The upload delivered extracted TEXT of Part IV, not the PDF file, and the DGCA
# portal's public page is a JavaScript shell that does not expose the document's
# attachment id, so the binary could not be retrieved to hash it.
#
# A SHA-256 can only be computed over bytes. Hashing the extracted text would be
# worse than leaving this pending: it would produce a value that looks like
# provenance, would satisfy `verify_source_document`, and would attest to a
# document nobody holds. The extracted text is not the legal source; the archived
# original is.
#
# To complete: place the exact PDF at `source.pdf` in this directory, run
# `sha256sum source.pdf`, record the digest below and set `archived: true`.
# `verify_source_document` then checks the file against the recorded value on every
# load and refuses a verified load if they disagree.
# ---------------------------------------------------------------------------
local_path: source.pdf
content_sha256: PENDING_ARCHIVAL
archived: false

self_declared_scope: >-
  Para 1.6 states the CAR is issued under Rule 133A of the Aircraft Rules 1937 with the approval
  of the Ministry of Civil Aviation, for information, guidance and compliance of all concerned.
  Para 1.7 makes it applicable to all scheduled and non-scheduled operators. Paras 1.2 and 1.3
  extend it to non-scheduled flights and to foreign carriers operating to and from India, and
  place the compliance obligation on the airline performing the flight. This is primary
  regulation, not a public-information summary.

