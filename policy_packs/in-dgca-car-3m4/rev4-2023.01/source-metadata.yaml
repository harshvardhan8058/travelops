# Checked 2026-08-31. Recorded as evidence that the check was performed, not as a substitute for
# confirming the revision on the DGCA portal on the day of promotion.
supersession_check:
  performed_at: 2026-08-31
  method: >-
    DGCA portal retrieval, plus web search of Parliament answers and contemporaneous reporting
  part_iv:
    finding: no later revision of Series M Part IV identified
    evidence:
      - source: Rajya Sabha unstarred question 169, answered 2 February 2026
        note: >-
          Ministry of Civil Aviation answer cites CAR Section 3 Series M Part IV by its Rev. 4
          subject title as the governing instrument, with no mention of a later revision.
        url: https://sansad.in/getFile/annex/270/AU169_fPCFYi.pdf?source=pqars
      - source: Rajya Sabha unstarred question 2, answered 21 July 2025
        note: >-
          Same instrument cited for delay and cancellation facilities, and force majeure
          described in the terms of Paras 1.4 and 1.5.
        url: https://sansad.in/getFile/annex/268/AU2_eYOYZp.pdf?source=pqars
      - source: NDTV, February 2026
        note: >-
          Minister of State for Civil Aviation quoted citing Part IV and stating there is no plan
          for automatic flight-delay compensation. Independently corroborates that this
          instrument provides no monetary compensation for delay.
        url: https://www.ndtv.com/india-news/no-plan-for-automatic-flight-delay-compensation-20-lakh-hit-in-2025-centre-11859629
  part_ii:
    finding: >-
      Rev. 3 dated 24 February 2026 is the current revision and supersedes the earlier issue
      dated 22 May 2008. The 2008 issue is still served from the portal under a different
      attachment id and must not be used.
    evidence:
      - source: the archived Rev. 3 document itself
        note: >-
          Cover page reads DATED 24 February, 2026 with EFFECTIVE 26 March 2026, and the footer
          on every page reads Rev. 3, dated 24 Feb 2026.
      - source: reporting dated 24 February
        note: >-
          Describes the amended CAR introducing a 48-hour cancellation and modification window,
          which matches Para 3(e) of the archived Rev. 3.
        url: https://www.businessworld.in/article/dgca-eases-ticket-refund-rules-48-hour-free-cancellation-window-introduced-595365
  caveat: >-
    Absence of evidence of a later revision is not proof that these are current. Both documents
    must be re-checked on the DGCA portal on the day of promotion; that check is listed in
    pack.yaml under blocks_verified_mode_until.

# Questions the primary sources raise against each other or against the system's facts. Recorded
# rather than resolved, because resolving them is a reviewer's job.
open_source_questions:
  - id: SQ-1
    note: >-
      Part IV Para 3.4.3 attaches no advance-communication condition to hotel accommodation. The
      2019 MoCA booklet, from which the charter pack was built, described one. The primary text
      governs, so the charter pack's rule is narrower than the regulation. Tracked as RQ-1.
  - id: SQ-2
    note: >-
      Part IV Para 3.4.4 excuses adherence to Para 3.8 — the facilities themselves — for a delay
      caused by extraordinary circumstances. The charter pack preserved duty of care through its
      exemption. Tracked as RQ-2.
  - id: SQ-3
    note: >-
      Part II Rev. 3 Para 3(c) places the onus of an agent-purchased refund on the AIRLINE within
      14 working days. The 2019 booklet said the refund comes from the travel agent. The primary
      text governs.
  - id: SQ-4
    note: >-
      Part II Rev. 3 Para 3(e) sets the free cancellation or amendment window at 48 hours, with
      conditions the booklet did not state: booked directly through the airline website, and not
      available where departure is under 7 days domestic or 15 days international. This answers
      the charter pack's excluded 24-hour rule — the window is 48 hours, not 24.
  - id: SQ-5
    note: >-
      Part IV Para 3.6.1 and Part II Para 3(k) treat foreign carriers differently. Part II is
      unconditional: refund per country-of-origin regulations. Part IV is disjunctive: compensation
      per country of origin OR per Paras 3.2.2/3.3.2/3.5.1. Both defer rather than compute here.
      Tracked as RQ-6.

