# THERE IS NO SOURCE DOCUMENT, because there is no source.
#
# `archived: false` and an absent `content_sha256` are the truthful values, and they are exactly
# what `verify_source_document` refuses. That refusal is only applied in verified mode or to a pack
# claiming `approved`, so this pack loads in demo mode and can never load in verified mode —
# which is the property demo mode needs.
#
# A fictional pack must not carry a hash that looks like provenance. Inventing one would make the
# integrity check pass on a document nobody can produce, which is the precise failure G3 exists to
# prevent.
