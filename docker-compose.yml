# TravelOps AI — local development and demo stack.
#
# Host publication is loopback-only by design (docs/26-implementation-contracts.md):
# the API process listens on 0.0.0.0 INSIDE its container so Docker networking works,
# while published ports bind to 127.0.0.1. Postgres and Redis are not published at all.

name: travelops

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: travelops
      POSTGRES_PASSWORD: travelops
      POSTGRES_DB: travelops
    volumes:
      - travelops_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travelops -d travelops"]
      interval: 5s
      timeout: 3s
      retries: 20
    # Deliberately not published to the host. Use `make db-shell`.
    expose:
      - "5432"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    expose:
      - "6379"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      # Container-internal hostnames override whatever .env holds for host use.
      DATABASE_URL: postgresql+asyncpg://travelops:travelops@postgres:5432/travelops
      REDIS_URL: redis://redis:6379/0
      POLICY_PACK_DIR: /app/policy_packs
      ASSURANCE_CONFIG_PATH: /app/config/assurance.v1.yaml
    volumes:
      - ./backend/app:/app/app
      - ./policy_packs:/app/policy_packs:ro
      - ./config:/app/config:ro
      - ./data:/app/data
      # app/api/fixtures_router.py resolves FIXTURE_DIR to /fixtures/api inside the
      # container. Without this mount every fixture endpoint returns ENTITY_NOT_FOUND,
      # because the build context is ./backend and repo-root fixtures/ is never copied in.
      - ./fixtures:/fixtures:ro
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live', timeout=3).status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_BASE_URL: http://127.0.0.1:8000/api/v1
      VITE_USE_FIXTURES: "false"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      # scripts/sync-fixtures.mjs resolves its source to /fixtures/api inside the
      # container. Without this mount the predev hook fails, `npm run dev` never starts,
      # and :5173 refuses the connection.
      - ./fixtures:/fixtures:ro
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      api:
        condition: service_started

volumes:
  travelops_pgdata:
